<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtra Form</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    


    <form method="post" class="main-form">
        <div class="card-header">Sign up</div>
    <div class="card-body">
    <div class="form-group">
        <label for="username">Username</label>
        <input id="username" class="form-input" type="text" placeholder="Username">
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input id="email" class="form-input" type="email" placeholder="Email">
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input id="password" class="form-input" type="password" placeholder="Password">
    </div>
    <div class="form-group">
        <label for="retype">Retype password</label>
        <input id="retype" class="form-input" type="password" placeholder="Retype password">
    </div>

    <label class="checkbox"><input type="checkbox"> Accept the terms and policies</label>
    <button type="submit" class="button btn-primary">Sign up</button>

    <hr class="divider">
    <p class="signin-text">Already have an account?</p>
    <button type="button" class="button btn-secondary">Sign in</button>
    </div>
    </form>
</body>
</html>
